[tasks.elixir_ls]
description = "Install the Elixir language server"
shell = "bash -euo pipefail -c"
run = '''
curl -OL https://github.com/elixir-lsp/elixir-ls/releases/download/v0.21.3/elixir-ls-v0.21.3.zip
mkdir -p ~/.elixir-ls
unzip elixir-ls-v0.21.3.zip -d ~/.elixir-ls
chmod +x ~/.elixir-ls/language_server.sh
echo "export PATH=\$PATH:~/.elixir-ls" >> ~/.bashrc
'''

[tasks.lua_ls]
description = "Install the Lua language server"
shell = "bash -euo pipefail -c"
run = '''
curl -LO https://github.com/LuaLS/lua-language-server/releases/download/3.9.1/lua-language-server-3.9.1-linux-x64.tar.gz
mkdir -p ~/.lua-ls
tar -xvf lua-language-server-3.9.1-linux-x64.tar.gz -C ~/.lua-ls
chmod +x ~/.lua-ls/bin/lua-language-server
echo "export PATH=\$PATH:~/.lua-ls/bin" >> ~/.bashrc
'''

[tasks.neovim]
description = "Build and install neovim from source"
shell = "bash -euo pipefail -c"
run = '''
sudo apt-get install -y \
    ssh \
    ripgrep \
    fzf \
    ninja-build \
    gettext \
    cmake \
    unzip \
    curl \
    build-essential
git clone https://github.com/neovim/neovim
cd neovim
git checkout stable
make CMAKE_BUILD_TYPE=RelWithDebInfo
cd build
cpack -G DEB
sudo dpkg -i --force-overwrite nvim-linux64.deb
'''

[tasks.tmux]
description = "Install tmux"
run = "sudo apt-get install -y tmux"

[tasks.stow]
description = "Preview stow links into $HOME (pass --apply to link for real)"
usage = '''
flag "--apply" help="Create the symlinks instead of previewing them"
'''
shell = "bash -euo pipefail -c"
run = '''
command -v stow >/dev/null || { echo "stow not found: brew install stow" >&2; exit 1; }
if [ -n "${usage_apply:-}" ]; then
  stow --dir "$MISE_PROJECT_ROOT" --target "$HOME" --restow .
else
  stow --dir "$MISE_PROJECT_ROOT" --target "$HOME" --restow --simulate --verbose=1 .
fi
'''

[tasks.install]
description = "Run the full install"
run = [
  { task = "elixir_ls" },
  { task = "lua_ls" },
  { task = "neovim" },
  { task = "tmux" },
  { task = "stow" },
]

[tasks.uninstall]
description = "Remove installed language servers, configs, and the neovim checkout"
shell = "bash -euo pipefail -c"
run = '''
rm -rf ~/.elixir-ls
rm -rf ~/.lua-ls
rm -rf ~/.config/nvim
rm -rf ~/.config/tmux
rm -rf "$MISE_PROJECT_ROOT/neovim"
'''
